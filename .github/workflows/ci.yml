name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 鎖 major 不鎖 patch（現行 LTS）
          node-version: '24'

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          count=0
          for f in plugins/**/test-*.mjs; do
            echo "== $f"
            node "$f"
            count=$((count+1))
          done
          echo "ran $count test files"
          if [ "$count" -lt 1 ]; then
            echo "::error::glob 零命中——一個測試檔都沒跑到（防假綠斷言）"
            exit 1
          fi

      - name: skill-lint
        shell: bash
        run: node plugins/loops-workflow/scripts/skill-lint.mjs

      - name: codex-plugin-lint
        shell: bash
        # Tier A 機械 guard（#182）：驗 Codex 薄 adapter 必要欄位／雙 manifest 同步／
        # marketplace 零複製；--root . 用 repo root（M2）掃描，不是 plugin-local。
        run: node plugins/loops-workflow/scripts/codex-plugin-lint.mjs --root .

      - name: reviewer drift-check
        shell: bash
        # 21 個 reviewer/validator agent 檔由 gen-reviewers.mjs 從單一真相源重生；
        # 手改 agents/*.md 而非改真相源 → 此步紅（指出漂移檔 + 漂在哪塊）。
        run: node plugins/loops-workflow/scripts/gen-reviewers.mjs --check

      - name: compat-lint
        shell: bash
        # 雙 harness 相容層機械 guard（C2/C3/C4/C5/C6，#183）：capability-registry.json
        # 與 references/ 交付物對帳；--root . 用 repo root 掃描。
        run: node plugins/loops-workflow/scripts/compat-lint.mjs --root .

      - name: check-registry-shape
        shell: bash
        # capability-registry.json 機械形狀 guard（#183）：facet 身分／fallback·repro
        # 完整性／agent tier·effort 對帳／overrides 完整性。
        run: node plugins/loops-workflow/scripts/check-registry-shape.mjs --root .

      - name: check-emit-residual
        shell: bash
        # 決策輸出點 guard（#183 T13）：確認 production hook 都改走 emitDecision()，
        # 沒有人私下自組決策信封（那會在切 harness 時靜默漏接）。
        run: node plugins/loops-workflow/scripts/check-emit-residual.mjs

      - name: check-baseline-whitelist
        shell: bash
        # 基線測試檔白名單 guard（#183 T27）：Run tests 的 glob 迴圈只保證「跑到的都綠」，
        # 不保證「該跑的都在」——此步逐檔存在性檢查基線測試檔清單，防刪測試假綠。
        run: node plugins/loops-workflow/scripts/check-baseline-whitelist.mjs --root .

      - name: registry-compiler
        shell: bash
        # policy／component／integration 三份 registry 的機械 guard：id 唯一與 dangling、
        # 覆寫核可、fail-closed 必填、投影標記漂移、元件雙向一致與環、互斥組與平台中立。
        # 沒有這步，registry 可以寫成互相矛盾或指向不存在的檔案而無人察覺。
        run: node plugins/loops-workflow/scripts/registry-compiler.mjs --root .

      - name: registry 覆蓋率與波及面煙霧
        shell: bash
        # 上一步只保證 registry 自洽——填得越空越容易全綠。此步壓覆蓋率地板（每支 production
        # hook 都要登記、每條 Operating Rule 都要有非空 policy 承載），並端到端跑一次
        # --affected 查詢：已登記路徑查得到下游必跑測試、未登記路徑落進 unmatched。
        run: node plugins/loops-workflow/scripts/test-registry-coverage.mjs
